<div class="hero-wrapper">
    <div class="hero-title">
        Sistem Rekap Absensi Magang<br>
        <span class="brand-orange">
            PT Japfa Comfeed Indonesia
        </span>
    </div>
    <div class="hero-subtitle">
        Sistem otomatis untuk mengelola dan merekap data absensi peserta magang 
        secara cepat dan efisien.
    </div>
    <a href="#rekap-section" class="hero-button">
        Mulai Rekap
    </a>

<script>
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - 20;
        const startPosition = window.pageYOffset;
        const distance = targetPosition - startPosition;
        const duration = 250;
        let start = null;

        function animation(currentTime) {
            if (start === null) start = currentTime;
            const timeElapsed = currentTime - start;
            const run = ease(timeElapsed, startPosition, distance, duration);
            window.scrollTo(0, run);

            if (timeElapsed < duration) requestAnimationFrame(animation);
        }

        function ease(t, b, c, d) {
            t /= d/2;
            if (t < 1) return c/2*t*t + b;
            t--;
            return -c/2 * (t*(t-2) - 1) + b;
        }

        requestAnimationFrame(animation);
    });
});
</script>
</div>
